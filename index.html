<style>
:root{--navy:#173a7e;--navy2:#0f2a5e;--green:#4caf3a;--green2:#3a8f2b;--sky:#e6f2fc;--tx:#14233f;--mut:#5a6b86;--bd:#c9d9ee;--err:#b3261e;--ok:#2f7d1f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;background:linear-gradient(180deg,#d9ebfb 0%,#f3f9ff 45%,#ffffff 100%);min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
header{text-align:center;margin-bottom:14px}
header img{width:92px;height:auto}
.pill{background:var(--navy);color:#fff;border-radius:40px;padding:10px 18px;font-size:1.25rem;font-weight:700;margin:8px 0}
.sub{font-weight:700;color:var(--navy);margin:6px 0 2px}
.line{height:3px;background:var(--green);border-radius:3px;margin:8px 0}
.years{background:#dbeafa;color:var(--navy);border-radius:30px;padding:6px 14px;font-weight:700;font-size:.95rem;display:inline-block}
.today{margin-top:10px;color:var(--navy);font-weight:700;font-size:.95rem}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(23,58,126,.08)}
h2{font-size:1.05rem;margin:0 0 6px;color:var(--navy)}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=email],input[type=number],select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:10px;background:#f8fbff;color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--green);border-color:var(--green)}
.opts{display:flex;flex-wrap:wrap;gap:8px 16px}.opts label{display:flex;align-items:center;gap:6px;font-weight:400;margin:0}
input[type=radio]{accent-color:var(--navy)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;font-weight:700}
button.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.full{width:100%;margin-top:18px;font-size:1.05rem}
button:disabled{opacity:.6}
.msg{margin-top:10px;font-size:.9rem}.err{color:var(--err)}.ok{color:var(--ok)}
footer{text-align:center;margin-top:22px;padding-top:14px;border-top:3px solid var(--green)}
footer img{width:64px;height:auto}
footer p{margin:4px 0;color:var(--navy);font-weight:700;font-size:.95rem}
footer small{color:var(--mut)}
</style>
</head>

<script>
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbz8lf_Go2NXn2Yo2cBq7h6OLKSA5dnsEgUUqTA14B7smglij77mgE1s51orVIwy10zD/exec";
(function(){
  var $=function(i){return document.getElementById(i)};
  (function(){var d=new Date(),n=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][d.getDay()],
    z=function(x){return (x<10?'0':'')+x};
    $('today').textContent='اليوم: '+n+'  الموافق: '+z(d.getDate())+' / '+z(d.getMonth()+1)+' / '+d.getFullYear()})();
  function radio(n){var e=document.querySelector('input[name='+n+']:checked');return e?e.value:''}
  function say(t,c){$('msg').textContent=t;$('msg').className='msg '+(c||'')}
  $('send').onclick=async function(){
    var p={name:$('name').value.trim(),gender:$('gender').value,age:$('age').value.trim(),job:$('job').value.trim(),
      party:radio('party'),addr:$('addr').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),
      dis:radio('dis'),head:radio('head')};
    if(!p.name||!p.gender||!p.party||!p.phone){say('الرجاء تعبئة الحقول المطلوبة (*)','err');return}
    $('send').disabled=true;
    try{
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams(p)});
      $('form').innerHTML='<p class="ok" style="font-weight:700">تم تسجيل حضورك بنجاح. شكراً لمشاركتك!</p><button class="sec" onclick="location.reload()">تسجيل شخص آخر</button>';
    }catch(e){say('تعذر الإرسال، تأكد من الاتصال بالإنترنت وحاول مرة أخرى','err');$('send').disabled=false}
  };
})();
</script>
