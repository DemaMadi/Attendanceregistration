<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل حضور – الخطة التنموية المحلية 2027–2031</title>
<style>
:root{--bg:#f5f7f4;--card:#fff;--tx:#1d2a22;--mut:#5f6f65;--pri:#2e7d4f;--pri-tx:#fff;--bd:#d5ddd7;--err:#b3261e;--ok:#1b6b3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b241f;--tx:#e8efe9;--mut:#9fb0a5;--pri:#4caf78;--pri-tx:#0c1a12;--bd:#33423a;--err:#ff8a80;--ok:#7be0a4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b241f;--tx:#e8efe9;--mut:#9fb0a5;--pri:#4caf78;--pri-tx:#0c1a12;--bd:#33423a;--err:#ff8a80;--ok:#7be0a4;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:8px 0 2px}h2{font-size:1rem;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=email],input[type=number],select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.opts{display:flex;flex-wrap:wrap;gap:8px 16px}.opts label{display:flex;align-items:center;gap:6px;font-weight:400;margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:11px 16px;background:var(--pri);color:var(--pri-tx);font-weight:600}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.full{width:100%;margin-top:16px}
.msg{margin-top:10px;font-size:.9rem}.err{color:var(--err)}.ok{color:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.82rem;white-space:nowrap}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:right}th{background:var(--bg)}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>الخطة التنموية المحلية للأعوام 2027–2031</h1>
  <p class="sub">بلدية سلفيت – تسجيل حضور المشاركين/ات</p>

  <section class="card" id="formCard">
    <h2>الرجاء تعبئة بياناتك</h2>
    <div id="form">
      <label for="name">الاسم *</label><input type="text" id="name" autocomplete="name">
      <div class="row">
        <div><label for="gender">الجنس *</label>
          <select id="gender"><option value="">اختر</option><option>ذكر</option><option>أنثى</option></select></div>
        <div><label for="age">العمر</label><input type="number" id="age" min="1" max="120" inputmode="numeric"></div>
      </div>
      <label for="job">العمل</label><input type="text" id="job">
      <label>الجهة *</label>
      <div class="opts" id="party">
        <label><input type="radio" name="party" value="الهيئة المحلية"> الهيئة المحلية</label>
        <label><input type="radio" name="party" value="الوزارات / القطاع العام"> الوزارات / القطاع العام</label>
        <label><input type="radio" name="party" value="مؤسسات المجتمع المدني"> مؤسسات المجتمع المدني</label>
        <label><input type="radio" name="party" value="القطاع الخاص"> القطاع الخاص</label>
        <label><input type="radio" name="party" value="مواطن/ة"> مواطن/ة</label>
      </div>
      <label for="addr">العنوان</label><input type="text" id="addr">
      <label for="phone">أرقام الاتصال *</label><input type="tel" id="phone" inputmode="tel">
      <label for="email">البريد الإلكتروني</label><input type="email" id="email">
      <label>وجود إعاقة</label>
      <div class="opts"><label><input type="radio" name="dis" value="نعم"> نعم</label><label><input type="radio" name="dis" value="لا"> لا</label></div>
      <label>رب أسرة لشخص ذي إعاقة</label>
      <div class="opts"><label><input type="radio" name="head" value="نعم"> نعم</label><label><input type="radio" name="head" value="لا"> لا</label></div>
      <button class="full" id="send">تسجيل الحضور</button>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </section>
  </section>
</main>
<script>
// ضع هنا رابط تطبيق الويب من Google Apps Script (انظر ملف الشرح)
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbz8lf_Go2NXn2Yo2cBq7h6OLKSA5dnsEgUUqTA14B7smglij77mgE1s51orVIwy10zD/exec";
(function(){
  var $=function(i){return document.getElementById(i)};
  function radio(n){var e=document.querySelector('input[name='+n+']:checked');return e?e.value:''}
  function say(t,c){$('msg').textContent=t;$('msg').className='msg '+(c||'')}
  $('send').onclick=async function(){
    var p={name:$('name').value.trim(),gender:$('gender').value,age:$('age').value.trim(),job:$('job').value.trim(),
      party:radio('party'),addr:$('addr').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),
      dis:radio('dis'),head:radio('head')};
    if(!p.name||!p.gender||!p.party||!p.phone){say('الرجاء تعبئة الحقول المطلوبة (*)','err');return}
    $('send').disabled=true;
    try{
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams(p)});
      $('form').innerHTML='<p class="ok" style="font-weight:600">تم تسجيل حضورك بنجاح. شكراً لمشاركتك!</p><button class="sec" onclick="location.reload()">تسجيل شخص آخر</button>';
    }catch(e){say('تعذر الإرسال، تأكد من الاتصال بالإنترنت وحاول مرة أخرى','err');$('send').disabled=false}
  };
})();
</script>
</body>
</html>
